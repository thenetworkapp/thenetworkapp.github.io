<!DOCTYPE html>
<html>
<head>
  <title>Connecting Instagram...</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; 
           justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    p { color: #666; font-size: 15px; }
  </style>
</head>
<body>
  <p>Connecting your Instagram account...</p>
  <script>
    const params = new URLSearchParams(window.location.search)
    const code = params.get('code')
    const error = params.get('error')
    if (code) {
      window.location.href = 'the-network://auth/instagram?code=' + encodeURIComponent(code)
    } else if (error) {
      window.location.href = 'the-network://auth/instagram?error=' + encodeURIComponent(error)
    }
  </script>
</body>
</html>
